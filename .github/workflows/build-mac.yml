name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14      # Apple Silicon (M1 이후)
            arch: arm64
          - os: macos-13      # Intel
            arch: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip requests pyinstaller
      - name: Build .app
        run: |
          python -m PyInstaller --onefile --windowed --name fxwidget \
            --distpath dist_mac --workpath build_mac --specpath build_mac fxwidget.py
          cd dist_mac && ditto -c -k --sequesterRsrc --keepParent fxwidget.app fxwidget-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fxwidget-mac-${{ matrix.arch }}
          path: dist_mac/fxwidget-mac-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: fxwidget macOS 최신 빌드
          body: |
            - fxwidget-mac-arm64.zip : Apple Silicon(M1/M2/M3/M4) 맥
            - fxwidget-mac-intel.zip : Intel 맥
            압축 해제 후 fxwidget.app 우클릭 > 열기 (첫 실행 1회)
          files: artifacts/*.zip
          prerelease: false
